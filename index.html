<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#5C3D2E">
  <title>義大利行程</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Noto Serif TC', Georgia, serif;
      background: #F5EFE6;
      color: #3B2A1A;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto
    }

    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap');

    /* Header */
    .header {
      background: #3B2A1A;
      color: #F5EFE6;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px
    }

    .header p {
      font-size: 12px;
      opacity: .7;
      margin-top: 2px
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .edit-btn {
      background: #C9A96E;
      color: #3B2A1A;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer
    }

    /* Day tabs */
    .day-tabs {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 14px 16px;
      background: #EDE0CF;
      scrollbar-width: none
    }

    .day-tabs::-webkit-scrollbar {
      display: none
    }

    .day-tab {
      flex: 0 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
      border: 2px solid transparent;
      min-width: 70px
    }

    .day-tab.active {
      background: #3B2A1A;
      color: #F5EFE6;
      border-color: #3B2A1A
    }

    .day-tab .dn {
      font-size: 11px;
      opacity: .6;
      margin-bottom: 2px
    }

    .day-tab .date {
      font-size: 18px;
      font-weight: 700
    }

    .day-tab .city {
      font-size: 11px;
      margin-top: 2px
    }

    /* Day title */
    .day-title {
      padding: 16px 20px 8px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .day-badge {
      background: #3B2A1A;
      color: #F5EFE6;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 700
    }

    .day-name {
      font-size: 18px;
      font-weight: 700
    }

    /* Timeline */
    .timeline {
      padding: 0 20px 20px
    }

    .t-item {
      display: flex;
      gap: 12px;
      margin-bottom: 4px
    }

    .t-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 52px
    }

    .t-time {
      font-size: 14px;
      font-weight: 700;
      color: #5C3D2E;
      white-space: nowrap
    }

    .t-line-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px
    }

    .t-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #D4B896;
      min-height: 32px
    }

    .t-duration {
      position: relative;
      z-index: 1;
      font-size: 10px;
      color: #A09080;
      background: #F5EFE6;
      padding: 1px 6px;
      border-radius: 10px;
      white-space: nowrap;
      border: 1px solid #E0D4C4
    }

    .t-right {
      flex: 1;
      background: #fff;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .06)
    }

    .t-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3
    }

    .t-note {
      font-size: 13px;
      color: #7A6350;
      margin-top: 4px;
      line-height: 1.5
    }

    .t-map {
      display: inline-block;
      margin-top: 8px;
      background: #EDE0CF;
      color: #5C3D2E;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit
    }

    .t-map-auto {
      background: #E8E4DF;
      color: #A89880;
      border: 1.5px dashed #C8C0B8;
    }

    .t-route {
      display: inline-block;
      margin-top: 8px;
      margin-left: 6px;
      background: #E8F0E8;
      color: #5C7A5C;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none
    }

    .t-type-transport .t-right {
      border-left: 4px solid #8BACC8
    }

    .t-type-meal .t-right {
      border-left: 4px solid #C8A87A
    }

    .t-type-hotel .t-right {
      border-left: 4px solid #A8C8A0
    }

    .t-type-sight .t-right {
      border-left: 4px solid #C8A0B8
    }

    /* Info cards */
    .info-cards {
      padding: 0 20px 20px
    }

    .info-card {
      background: #fff;
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .06)
    }

    .info-card-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer
    }

    .info-card-title {
      font-size: 15px;
      font-weight: 700
    }

    .info-card-body {
      padding: 0 16px 12px;
      font-size: 14px;
      color: #5C3D2E;
      line-height: 1.7;
      display: none
    }

    .info-card.open .info-card-body {
      display: block
    }

    .chevron {
      transition: .2s;
      font-size: 12px
    }

    .info-card.open .chevron {
      transform: rotate(180deg)
    }

    /* Edit modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 200;
      align-items: flex-end
    }

    .modal-overlay.open {
      display: flex
    }

    .modal {
      background: #F5EFE6;
      border-radius: 24px 24px 0 0;
      padding: 24px 20px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto
    }

    .modal h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px
    }

    .mode-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .mode-btn {
      flex: 1;
      min-width: 120px;
      padding: 10px;
      border: 2px solid #D4B896;
      border-radius: 12px;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center
    }

    .mode-btn.active {
      background: #3B2A1A;
      color: #F5EFE6;
      border-color: #3B2A1A
    }

    .textarea {
      width: 100%;
      min-height: 180px;
      border: 2px solid #D4B896;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      resize: vertical
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px
    }

    .input-field {
      flex: 1;
      border: 2px solid #D4B896;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fff
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px
    }

    .btn-cancel {
      flex: 1;
      padding: 13px;
      border: 2px solid #D4B896;
      border-radius: 14px;
      background: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer
    }

    .btn-save {
      flex: 2;
      padding: 13px;
      border: none;
      border-radius: 14px;
      background: #3B2A1A;
      color: #F5EFE6;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer
    }

    /* Diff */
    .diff-add {
      background: #d4f5d4;
      border-radius: 6px;
      padding: 2px 6px
    }

    .diff-del {
      background: #f5d4d4;
      text-decoration: line-through;
      border-radius: 6px;
      padding: 2px 6px;
      color: #888
    }

    /* Helpers */
    .empty {
      text-align: center;
      color: #A89080;
      padding: 40px 20px;
      font-size: 15px
    }

    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(245, 239, 230, .9);
      z-index: 300;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #D4B896;
      border-top-color: #3B2A1A;
      border-radius: 50%;
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .loading-text {
      font-size: 14px;
      color: #5C3D2E;
      font-weight: 700
    }

    .sync-btn {
      background: transparent;
      color: #F5EFE6;
      border: 1.5px solid rgba(255, 255, 255, .4);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 6px
    }
  .t-route-time{font-size:11px;color:#5C8A5C;margin-top:5px;font-weight:600;line-height:1.5}
  .t-alt{font-size:11px;color:#7A6350;background:#F5EFE6;padding:2px 6px;border-radius:6px;display:inline-block;margin-top:4px;margin-right:4px}
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(59, 42, 26, 0.9); color: #F5EFE6; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 700; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .toast.show { opacity: 1; }
  </style>
</head>

<body>

  <div class="loading-overlay" id="loadingOverlay">

    <div style="background:#F5EFE6;border-radius:20px;padding:24px;width:100%;max-width:360px">

      <input id="editContentInput" type="text" placeholder="行程名稱" style="width:100%;border:2px solid #D4B896;border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;margin-bottom:14px;box-sizing:border-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">

        <button onclick="addItemAlt()" style="background:none;border:none;color:#5C8A5C;font-size:12px;font-weight:700;cursor:pointer">+ 新增選項</button>
      </div>
      <div id="itemAltsContainer" style="margin-bottom:14px;display:flex;flex-direction:column;gap:6px"></div>
      <div style="display:flex;gap:10px">

        <button onclick="confirmItemEdit()" style="flex:2;padding:12px;border:none;border-radius:14px;background:#3B2A1A;color:#F5EFE6;font-size:14px;font-weight:700;cursor:pointer">確認</button>

    </div>

  <div id="routeModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;align-items:flex-end">
    <div style="background:#F5EFE6;border-radius:24px 24px 0 0;padding:24px 20px;width:100%">
      <p style="font-size:15px;font-weight:700;margin-bottom:4px">記錄交通時間</p>
      <p style="font-size:12px;color:#A89080;margin-bottom:14px">在 Google Maps 查到後填入（沒有的留空）</p>

    </div>
  </div>

  <script>
    // ===== RAW ITINERARY DATA =====
    const DEFAULT_TEXT = `6/21 (六) 羅馬：抵達與市區適應

    // ===== PARSER =====
    function parseItinerary(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l);
      const days = [];
      let cur = null;

      for (const line of lines) {
        // Date line
        if (/^\d+\/\d+/.test(line)) {
          const m = line.match(/^(\d+\/\d+)\s*[（(]([^）)]+)[）)]?\s*(.*)/);
          if (m) {
            cur = { date: m[1], weekday: m[2], title: m[3] || '', items: [], hotel: '', lunch: '', dinner: '', transport: '', notes: [], rainBackup: '' };
          } else {
            cur = { date: line.match(/^(\d+\/\d+)/)[1], weekday: '', title: line.replace(/^\d+\/\d+\s*/, ''), items: [], hotel: '', lunch: '', dinner: '', transport: '', notes: [], rainBackup: '' };
          }
          days.push(cur);
          continue;
        }
        if (!cur) continue;

        // Special fields
        if (line.startsWith('住宿：') || line.startsWith('住宿:')) { cur.hotel = line.replace(/^住宿[：:]/, ''); continue; }
        if (line.startsWith('午餐：') || line.startsWith('午餐:')) { cur.lunch = line.replace(/^午餐[：:]/, ''); continue; }
        if (line.startsWith('晚餐：') || line.startsWith('晚餐:')) { cur.dinner = line.replace(/^晚餐[：:]/, ''); continue; }
        if (line.startsWith('交通：') || line.startsWith('交通:')) { cur.transport = line.replace(/^交通[：:]/, ''); continue; }
        if (line.startsWith('提醒：') || line.startsWith('提醒:')) { cur.notes.push(line.replace(/^提醒[：:]/, '')); continue; }
        if (line.startsWith('備註：') || line.startsWith('備註:')) { cur.notes.push(line.replace(/^備註[：:]/, '')); continue; }
        if (line.startsWith('雨備：') || line.startsWith('雨備:')) { cur.rainBackup = line.replace(/^雨備[：:]/, ''); continue; }
        if ((line.startsWith('備選：') || line.startsWith('備選:')) && cur.items.length) {
          cur.items[cur.items.length-1].alternatives = line.replace(/^備選[：:]\s*/, '').split('/').map(s=>s.trim()).filter(Boolean);
          continue;
        }
        if ((line.startsWith('路線時間：') || line.startsWith('路線時間:')) && cur.items.length) {
          const last = cur.items[cur.items.length-1]; const rt = line.replace(/^路線時間[：:]/, '');
          last.routeTime = {};
          const bM=rt.match(/公車(\d+)min/); if(bM) last.routeTime.bus=+bM[1];
          const wM=rt.match(/走路(\d+)min/); if(wM) last.routeTime.walk=+wM[1];
          const mM=rt.match(/地鐵(\d+)min/); if(mM) last.routeTime.metro=+mM[1];
          const tM=rt.match(/私鐵(\d+)min/); if(tM) last.routeTime.train=+tM[1];
          continue;
        }

        // Time item
        const tm = line.match(/^(\d{1,2}:\d{2})\s+(.*)/);
        if (tm) {
          const content = tm[2];
          let type = 'sight';
          if (/搭|高鐵|火車|公車|飛機|機場|轉|郵輪|船/.test(content)) type = 'transport';
          else if (/午餐|晚餐|早餐|餐廳|吃/.test(content)) type = 'meal';
          else if (/飯店|住宿|入住|寄物|退房/.test(content)) type = 'hotel';

          cur.items.push({ time: tm[1], content: content.trim(), type, routeTime: null, alternatives: null, note: null });
          continue;
        }

        // Sub-note
        if (line.startsWith('>')) {
          if (cur.items.length) {
            const last = cur.items[cur.items.length - 1];
            last.note = (last.note ? last.note + ' · ' : '') + line.slice(1).trim();
          }
          continue;
        }
      }
      return days;
    }

    const DATE_CITY = { '6/21': '羅馬', '6/22': '羅馬', '6/23': '羅馬', '6/24': '南義', '6/25': '卡布里', '6/26': '龐貝', '6/27': '佛羅倫斯', '6/28': '佛羅倫斯', '6/29': '威尼斯', '6/30': '米蘭' };
    function getCityShort(d) {

    function timeDiff(t1, t2) {
      const [h1, m1] = t1.split(':').map(Number);
      const [h2, m2] = t2.split(':').map(Number);
      const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
      if (diff <= 0 || isNaN(diff)) return null;
      if (diff < 60) return diff + 'min';
      const h = diff / 60;
      return (Number.isInteger(h) ? h : h.toFixed(1)) + 'hr';
    }

    function renderDay() {
      const d = days[activeDay];
      if (!d) return;
      const daySpots = d.items.filter(it => it.type === 'sight' || it.type === 'meal' || it.type === 'hotel').map(it => it.content).join('|');
      const routeUrl = daySpots ? `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(d.items[0].content)}&destination=${encodeURIComponent(d.items[d.items.length-1].content)}&waypoints=${encodeURIComponent(daySpots)}&travelmode=transit` : '#';
      let html = `<div class="day-title" style="justify-content:space-between;">

      html += '<div class="timeline">';
      if (!d.items.length) { html += '<div class="empty">暫無行程</div>'; }
      else {
        d.items.forEach((item, i) => {
          const isLast = i === d.items.length - 1;
          const next = isLast ? null : d.items[i + 1];
          const dur = next ? timeDiff(item.time, next.time) : null;
          let durHtml = dur ? `<div class="t-duration">${dur}</div>` : '';
          
          let timeWarning = '';
          const rt = item.routeTime || {};
          const rtParts = [rt.bus?`公車 ${rt.bus}min`:'', rt.walk?`走路 ${rt.walk}min`:'', rt.metro?`地鐵 ${rt.metro}min`:'', rt.train?`私鐵 ${rt.train}min`:''].filter(Boolean);
          const rtDisplay = rtParts.length ? `<div class="t-route-time">【${rtParts.join(' / ')}】</div>` : '';
          
          if (dur && rtParts.length) {
             const [h1, m1] = item.time.split(':').map(Number);
             const [h2, m2] = next.time.split(':').map(Number);
             const totalMins = (h2 * 60 + m2) - (h1 * 60 + m1);
             const trafficMins = (rt.bus||0) + (rt.walk||0) + (rt.metro||0) + (rt.train||0);
             const isBigBuffer = /機場|飯店|入住|寄物|退房|抵達/.test(item.content) || (next && /機場|飯店|入住|寄物|退房|抵達/.test(next.content));
             const buffer = isBigBuffer ? 30 : 15;
             const actTime = totalMins - trafficMins - buffer;
             
             if (actTime < 0) {
                 timeWarning = `<div style="font-size:11px;color:#D84B4B;margin-top:4px;font-weight:700">⚠️ 時間可能太趕 (估計超出 ${-actTime} 分鐘)</div>`;
             } else if (actTime > 180 && item.type !== 'hotel') {
                 timeWarning = `<div style="font-size:11px;color:#C98A2E;margin-top:4px;font-weight:700">💡 空檔較多 (約剩 ${Math.floor(actTime/60)}hr${actTime%60}m)，可安排周邊行程</div>`;
             } else {
                 timeWarning = `<div style="font-size:11px;color:#5C8A5C;margin-top:4px;font-weight:700">✨ 預估遊玩時間：${Math.floor(actTime/60) > 0 ? Math.floor(actTime/60)+'hr ' : ''}${actTime%60}m</div>`;
             }
          }

          const altsDisplay = (item.alternatives && item.alternatives.length) ? `<div style="margin-top:6px">${item.alternatives.map((alt, idx) => `<span class="t-alt">選項${idx+1}：${alt}</span>`).join('')}</div>` : '';
          const routeBtn = !isLast ? `<button class="t-route" onclick="clickRoute(${activeDay},${i})">→ 查路線</button>` : '';
          const mapBtn = `<button class="t-route" style="background:#E8E4DF;color:#A89880;margin-left:6px" onclick="clickSingleMap(${activeDay},${i})">📍 單一地圖</button>`;

          html += `<div class="t-item t-type-${item.type}">
        <div class="t-left">
          <div class="t-time">${item.time}</div>
          ${!isLast ? `<div class="t-line-wrap"><div class="t-line"></div>${durHtml}</div>` : ''}
        </div>
        <div class="t-right" ontouchstart="startItemLongPress(${activeDay},${i})" ontouchend="endItemLongPress()" ontouchmove="endItemLongPress()" oncontextmenu="openItemEdit(${activeDay},${i});return false;">
          <div class="t-title">${item.content}</div>
          ${item.note ? `<div class="t-note">${item.note}</div>` : ''}
          <div style="margin-top:8px">${routeBtn}${mapBtn}</div>
          ${rtDisplay}
          ${timeWarning}
          ${altsDisplay}
        </div>
      </div>`;
        });
      }
      html += '</div>';

      // Info cards
      html += '<div class="info-cards">';
      if (d.lunch || d.dinner) {
        html += card('今日餐食', `${d.lunch ? '午餐：' + d.lunch : ''}${d.lunch && d.dinner ? '<br>' : ''}${d.dinner ? '晚餐：' + d.dinner : ''}`);
      }
      if (d.transport) html += card('今日交通', d.transport);
      if (d.rainBackup) html += card('雨備行程', d.rainBackup);
      if (d.notes.length) html += card('重要提醒', d.notes.join('<br>'));

    function rebuildDayText(d) {
        let out = `${d.date}${d.weekday ? ' (' + d.weekday + ')' : ''} ${d.title}\n`;
        d.items.forEach(item => {
          out += `${item.time} ${item.content}\n`;
          if (item.note) out += `>${item.note}\n`;
          if (item.alternatives && item.alternatives.length) out += `備選：${item.alternatives.join(' / ')}\n`;
          if (item.routeTime && Object.values(item.routeTime).some(v=>v)) {
            const rt=item.routeTime, parts=[];
            if(rt.bus) parts.push(`公車${rt.bus}min`);
            if(rt.walk) parts.push(`走路${rt.walk}min`);
            if(rt.metro) parts.push(`地鐵${rt.metro}min`);
            if(rt.train) parts.push(`私鐵${rt.train}min`);
            out += `路線時間：${parts.join('/')}\n`;
          }
        });
        if (d.lunch) out += `午餐：${d.lunch}\n`;
        if (d.dinner) out += `晚餐：${d.dinner}\n`;
        if (d.transport) out += `交通：${d.transport}\n`;
        if (d.hotel) out += `住宿：${d.hotel}\n`;

        return out;

    async function applyEdit() {
      if (editMode === 'full') {
        const newText = document.getElementById('editText').value.trim();
        if (!newText) return;
        rawText = newText;
        days = parseItinerary(rawText);
        activeDay = Math.min(activeDay, days.length - 1);
      } else if (editMode === 'single') {
        const i = parseInt(document.getElementById('singleDaySel').value);
        const newDayText = document.getElementById('singleDayText').value.trim();
        const parsed = parseItinerary(newDayText);
        if (parsed.length > 0) {
           days[i] = parsed[0];
           rawText = rebuildText();
        }
      } else if (editMode === 'add') {
        const di = parseInt(document.getElementById('addDay').value);
        const time = document.getElementById('addTime').value.trim();
        const content = document.getElementById('addContent').value.trim();
        if (!content) return;
        let type = 'sight';
        if (/搭|高鐵|火車|公車|飛機/.test(content)) type = 'transport';
        else if (/午餐|晚餐|早餐|吃/.test(content)) type = 'meal';
        else if (/飯店|住宿/.test(content)) type = 'hotel';
        const newItem = { time: time || '待定', content, type, routeTime: null, alternatives: null, note: null };
        const items = days[di].items;
        if (time) {
          let idx = items.findIndex(it => it.time > time);
          if (idx === -1) idx = items.length;
          items.splice(idx, 0, newItem);
        } else {
          items.push(newItem);
        }
        rawText = rebuildText();
      } else {
        const di = parseInt(document.getElementById('delDay').value);
        const ii = parseInt(document.getElementById('delItem').value);
        days[di].items.splice(ii, 1);
        rawText = rebuildText();
      }
      closeModal();
      renderTabs();
      renderDay();
      await saveToCloud(rawText);
    }

    function rebuildText() {
      return days.map(d => {
        let out = `${d.date}${d.weekday ? ' (' + d.weekday + ')' : ''} ${d.title}\n`;
        d.items.forEach(item => {
          out += `${item.time} ${item.content}\n`;
          if (item.note) out += `>${item.note}\n`;
          if (item.alternatives && item.alternatives.length) out += `備選：${item.alternatives.join(' / ')}\n`;
          if (item.routeTime && Object.values(item.routeTime).some(v=>v)) {
            const rt=item.routeTime, parts=[];
            if(rt.bus) parts.push(`公車${rt.bus}min`);
            if(rt.walk) parts.push(`走路${rt.walk}min`);
            if(rt.metro) parts.push(`地鐵${rt.metro}min`);
            if(rt.train) parts.push(`私鐵${rt.train}min`);
            out += `路線時間：${parts.join('/')}\n`;
          }
        });
        if (d.lunch) out += `午餐：${d.lunch}\n`;
        if (d.dinner) out += `晚餐：${d.dinner}\n`;
        if (d.transport) out += `交通：${d.transport}\n`;
        if (d.hotel) out += `住宿：${d.hotel}\n`;
        if (d.rainBackup) out += `雨備：${d.rainBackup}\n`;
        d.notes.forEach(n => out += `提醒：${n}\n`);
        return out;
      }).join('\n');
    }

    // ===== INIT =====
    loadFromCloud();

    // Close modal on overlay click
    document.getElementById('modalOverlay').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
